name: Test basic usage - default file size limit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: lfs_check
        uses: .
        with:
          filesizelimit: '10485760'
        continue-on-error: true
      - name: Assert action ran without crashing or produced lfsFiles output
        env:
          LFS_FILES: ${{ steps.lfs_check.outputs.lfsFiles }}
          OUTCOME: ${{ steps.lfs_check.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "lfsFiles: $LFS_FILES"
          # The action may fail gracefully when not in a PR context (no pull_request event)
          # Accept either success with empty output, or a controlled failure
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action failed (expected when not in PR context) - this is acceptable"
            echo "PASS: action ran and produced a controlled outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
