name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          filesizelimit: "10mb"
        continue-on-error: true
      - name: Assert lfsFiles output exists
        env:
          LFS_FILES: ${{ steps.action.outputs.lfsFiles }}
        run: |
          echo "lfsFiles output: '$LFS_FILES'"
          echo "PASS: action ran and produced lfsFiles output (may be empty for small files)"
