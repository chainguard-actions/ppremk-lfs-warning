name: Test basic non-PR usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          filesizelimit: "10mb"

      - name: Assert action ran (non-PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LFS_FILES: ${{ steps.action.outputs.lfsFiles }}
        run: |
          echo "Action outcome: $OUTCOME"
          echo "lfsFiles output: '$LFS_FILES'"
          # In non-PR context, the action should not set lfsFiles output
          # (lfsFiles is only set when large files are detected in a PR)
          if [ -n "$LFS_FILES" ]; then
            echo "FAIL: expected lfsFiles to be empty in non-PR context, got: $LFS_FILES"
            exit 1
          fi
          echo "PASS: lfsFiles is empty as expected in non-PR context"
