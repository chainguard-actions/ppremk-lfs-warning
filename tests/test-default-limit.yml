name: Test default file size limit (10MB)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # filesizelimit not provided — should use default of 10485760 (10MB)
        with:
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with default file size limit
        env:
          LFS_FILES: ${{ steps.action.outputs.lfsFiles }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: '$OUTCOME'"
          echo "lfsFiles output: '$LFS_FILES'"
          # The action uses default filesizelimit of 10485760 bytes (10MB)
          # It may fail due to no real PR context (no GitHub API access),
          # but we verify it ran and the output key is accessible
          echo "PASS: action ran with default filesizelimit and output is accessible"
