name: Test custom file size limit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          filesizelimit: "5mb"
        continue-on-error: true
      - name: Assert action ran with custom file size limit
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LFS_FILES: ${{ steps.action.outputs.lfsFiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "lfsFiles: $LFS_FILES"
          # The action may fail because there is no PR context under workflow_dispatch,
          # but it should have run (outcome must be set).
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome is empty — action did not run"
            exit 1
          fi
          echo "PASS: action ran with custom filesizelimit, outcome=$OUTCOME"
