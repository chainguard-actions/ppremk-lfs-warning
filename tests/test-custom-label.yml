name: Test custom label inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          labelName: "large-file-warning"
          labelColor: "ff6600"
          filesizelimit: "10mb"

      - name: Assert action ran with custom label config (non-PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LFS_FILES: ${{ steps.action.outputs.lfsFiles }}
        run: |
          echo "Action outcome: $OUTCOME"
          echo "lfsFiles output: '$LFS_FILES'"
          # In non-PR context, lfsFiles should not be set regardless of label config
          if [ -n "$LFS_FILES" ]; then
            echo "FAIL: expected lfsFiles to be empty in non-PR context, got: $LFS_FILES"
            exit 1
          fi
          echo "PASS: lfsFiles is empty as expected with custom label config"
