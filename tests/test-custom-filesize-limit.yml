name: Test custom file size limit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          filesizelimit: "50mb"

      - name: Assert action completed with custom file size limit
        env:
          LFS_FILES: ${{ steps.action.outputs.lfsFiles }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: '$OUTCOME'"
          echo "lfsFiles output: '$LFS_FILES'"
          # In a non-PR context the action skips the LFS file check regardless of filesizelimit.
          # lfsFiles is only set when large files are detected in a PR, so it should be empty here.
          if [ -n "$LFS_FILES" ]; then
            echo "FAIL: expected lfsFiles to be empty in non-PR context, got: $LFS_FILES"
            exit 1
          fi
          echo "PASS: action ran with custom filesizelimit=50mb and lfsFiles is empty (outcome=$OUTCOME)"
