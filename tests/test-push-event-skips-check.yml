name: Test LFS Warning - Push Event Skips PR Check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          filesizelimit: "10mb"

      - name: Assert action ran (push event skips PR check or fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action either succeeds (skips PR check) or fails due to API auth issues
          # Either way, it should have run and produced an outcome
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
